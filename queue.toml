# Convert2EPUB: what it's for
[[post]]
id = "ereader-pdf-vs-epub"
draft = true  # LinkedIn: other products, not posting
text = """
PDFs are built for paper. Every page has a fixed size, so on an e-reader you end up zooming and scrolling sideways.

EPUB works differently: the text reflows to fit your screen, and you pick the font size.

That's why I built Convert2EPUB. Do you read PDFs on your e-reader?
"""
linkedin = """
If you've ever opened a PDF on a Kindle or Kobo, you know the problem.

PDFs are built for paper. Every page has a fixed size, so on a small screen you zoom in, scroll sideways, zoom out, and repeat on every page.

EPUB works differently. The text reflows to fit whatever screen you're on, and you choose the font size.

That's the idea behind Convert2EPUB: it turns PDFs, including scanned books, into EPUBs with real chapters and a working table of contents.

What do you mostly read on your e-reader? #ebooks #reading
"""
link = "https://convert2epub.com"

