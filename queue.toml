# Posting queue. Each run posts the next due post to each platform, one per platform per run,
# in the order they appear in this file. Check your edits with: python3 poster.py check
#
#   id              required and unique. Never reuse or rename an id that has been posted.
#   date            optional, earliest day to post (YYYY-MM-DD). Without it, the post is due right away.
#   text            the post, used on every platform unless overridden below.
#   x / bluesky / linkedin
#                   optional text for one platform. Limits: X 280, Bluesky 300, LinkedIn 3000 characters.
#   link            optional URL, shown as a link card on Bluesky and LinkedIn.
#                   On X it's added only when x_include_link = true, because an X post
#                   with a link costs $0.20 instead of $0.015.
#   platforms       optional, e.g. ["bluesky", "linkedin"]. Default: all three.
#   draft = true    skip this post until you delete the line.


# ---------------------------------------------------------------------------
# X and Bluesky post 3 times a day, LinkedIn once (see .github/workflows/post.yml).
# Pattern: one story post (everywhere), then two conversation starters
# (X and Bluesky only). Keep that ratio so LinkedIn doesn't fall behind.
# Posts are general tips and context, plus posts about TrySEO (tryseo.org), the only product to promote.
# Never write about the products failing or having bugs.
# Delete `draft = true` on the ones you approve.
# ---------------------------------------------------------------------------


