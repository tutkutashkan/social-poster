name: Post to social

on:
  # Runs are started by cron-job.org at exact times (see README), not GitHub's scheduler.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would be posted, post nothing)"
        type: boolean
        default: true
      lane:
        description: "main = shared posts; extra = X-only posts"
        type: choice
        options: [main, extra]
        default: main
      platforms:
        description: "Comma-separated platforms"
        type: string
        default: "x,bluesky,linkedin"

permissions:
  contents: write

concurrency:
  group: social-poster

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post
        run: python poster.py run --platforms "$PLATFORMS" --lane "$LANE" ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          LANE: ${{ inputs.lane || 'main' }}
          PLATFORMS: ${{ inputs.platforms || 'x,bluesky,linkedin' }}
          X_MIN_GAP_MINUTES: "30"
          POSTER_TIMEZONE: Asia/Famagusta
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_TOKEN_EXPIRES: ${{ secrets.LINKEDIN_TOKEN_EXPIRES }}

      # Commit the record of what was posted, even if one platform failed,
      # so the next run doesn't post the same thing again.
      - name: Save posting record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Record posts from run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
